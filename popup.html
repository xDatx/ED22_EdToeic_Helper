<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 260px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      margin: 0;
      background: #fafafa;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      text-align: center;
      color: #111;
    }
    .field {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-weight: 500;
    }
    input[type="color"] {
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 38px;
      height: 26px;
      padding: 0;
      cursor: pointer;
    }
    select, input[type="number"] {
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 8px 0;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    button.secondary {
      background: #6c757d;
    }
    button.secondary:hover {
      background: #5a6268;
    }
    .status {
      text-align: center;
      color: #28a745;
      font-size: 12px;
      margin-top: 6px;
      height: 14px;
    }
  </style>
</head>
<body>
  <h3>Cấu hình Answer Box</h3>

  <div class="field">
    <label for="textColor">Màu chữ:</label>
    <input type="color" id="textColor" value="#00ff66">
  </div>

  <div class="field">
    <label for="bgColor">Màu nền:</label>
    <input type="color" id="bgColor" value="#000000">
  </div>

  <div class="field">
    <label for="borderColor">Màu viền:</label>
    <input type="color" id="borderColor" value="#00ff66">
  </div>

  <div class="field">
    <label for="fontSize">Cỡ chữ (px):</label>
    <input type="number" id="fontSize" min="10" max="32" value="15" style="width: 50px;">
  </div>

  <div class="field">
    <label for="fontFamily">Font chữ:</label>
    <select id="fontFamily">
      <option value="Arial, sans-serif">Arial</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="'Segoe UI', sans-serif">Segoe UI</option>
      <option value="'Consolas', monospace">Consolas</option>
    </select>
  </div>

  <div class="field">
    <label for="position">Vị trí hiển thị:</label>
    <select id="position">
      <option value="top-right">Góc trên - Phải</option>
      <option value="top-left">Góc trên - Trái</option>
      <option value="bottom-right">Góc dưới - Phải</option>
      <option value="bottom-left">Góc dưới - Trái</option>
    </select>
  </div>

  <button id="saveBtn">Lưu & Áp Dụng</button>
  <button id="resetPosBtn" class="secondary">Reset vị trí</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
